<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1062" viewBox="0 0 1280 1062" role="img" aria-labelledby="title desc">
  <title id="title">가로 창의 패널 닫힘과 열림 배치</title>
  <desc id="desc">위는 전체 카메라 영역과 오른쪽 중앙 열기 탭이다. 아래는 왼쪽 카메라 영역과 오른쪽 꾸미기 패널이며 화각과 안내가 카메라 영역을 따라간다.</desc>
  <style>
text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#203849;font-size:18px} .title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#536c7b}.small{font-size:15px}.white{fill:#fff}.strong{font-weight:700}.muted{fill:#617c8a}.num{font-size:14px;font-weight:700;fill:white}
</style>
