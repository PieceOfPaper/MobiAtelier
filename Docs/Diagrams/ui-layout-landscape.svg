  <text x="32" y="43" class="title" text-anchor="start">가로 배치 · 패널 여닫기</text>
  <text x="32" y="74" class="sub" text-anchor="start">같은 앱 크기에서 카메라 출력 영역만 달라진다. 도면의 크기·비율은 설명용이다.</text>
