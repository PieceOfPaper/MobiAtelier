  <text x="32" y="109" class="strong" text-anchor="start">3  시스템 메뉴</text>
  <text x="656" y="109" class="strong" text-anchor="start">4  옵션 · 게임 설치 경로</text>
  <rect x="250" y="194" width="352" height="420" rx="12" fill="#fff" stroke="none" />
  <text x="272" y="233" class="strong" text-anchor="start">시스템 메뉴</text>
  <text x="578" y="233" class="strong" text-anchor="middle">×</text>
  <rect x="266" y="253" width="320" height="48" rx="8" fill="#f0f5f7" stroke="none" />
  <rect x="276" y="264" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
  <text x="290" y="282" class="num" text-anchor="middle">K</text>
  <text x="317" y="284" class="" text-anchor="start">내보내기 (Export)</text>
  <rect x="266" y="313" width="320" height="48" rx="8" fill="#f0f5f7" stroke="none" />
  <rect x="276" y="324" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
  <text x="290" y="342" class="num" text-anchor="middle">L</text>
  <text x="317" y="344" class="" text-anchor="start">가져오기 (Import)</text>
  <rect x="266" y="373" width="320" height="48" rx="8" fill="#f0f5f7" stroke="none" />
  <rect x="276" y="384" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
