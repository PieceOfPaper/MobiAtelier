  <text x="317" y="404" class="" text-anchor="start">초기화</text>
  <rect x="266" y="433" width="320" height="48" rx="8" fill="#f0f5f7" stroke="none" />
  <rect x="276" y="444" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
  <text x="290" y="462" class="num" text-anchor="middle">N</text>
  <text x="317" y="464" class="" text-anchor="start">옵션</text>
  <rect x="266" y="493" width="320" height="48" rx="8" fill="#f0f5f7" stroke="none" />
  <rect x="276" y="504" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
  <text x="290" y="522" class="num" text-anchor="middle">O</text>
  <text x="317" y="524" class="" text-anchor="start">종료</text>
  <text x="272" y="585" class="small muted" text-anchor="start">ESC: 메뉴 닫기</text>
  <rect x="682" y="226" width="540" height="350" rx="12" fill="#fff" stroke="none" />
  <text x="706" y="265" class="strong" text-anchor="start">옵션</text>
  <rect x="706" y="292" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
  <text x="720" y="310" class="num" text-anchor="middle">P</text>
  <text x="746" y="313" class="strong" text-anchor="start">게임 설치 경로</text>
  <rect x="706" y="330" width="416" height="46" rx="8" fill="#f0f5f7" stroke="#d0dce4" />
  <text x="720" y="359" class="small muted" text-anchor="start">현재 정상 경로</text>
  <rect x="1132" y="330" width="66" height="46" rx="8" fill="#e2edf2" stroke="none" />
  <text x="1165" y="359" class="small" text-anchor="middle">찾기</text>
  <text x="706" y="408" class="small muted" text-anchor="start">경로 검사 결과 · 실패 사유</text>
  <text x="706" y="441" class="small" text-anchor="start">현재 작업은 저장 후 복원된다.</text>
  <text x="706" y="465" class="small" text-anchor="start">재시작하면 꾸미기 이력은 초기화된다.</text>
  <rect x="706" y="492" width="292" height="52" rx="8" fill="#285d73" stroke="none" />
  <rect x="716" y="505" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
  <text x="730" y="523" class="num" text-anchor="middle">Q</text>
  <text x="863" y="525" class="white" text-anchor="middle">적용 후 다시 시작</text>
  <rect x="1012" y="492" width="186" height="52" rx="8" fill="#e5edf2" stroke="none" />
  <rect x="1022" y="505" width="28" height="26" rx="7" fill="#285d73" stroke="none" />
  <text x="1036" y="523" class="num" text-anchor="middle">R</text>
  <text x="1121" y="525" class="" text-anchor="middle">돌아가기</text>
  <text x="32" y="710" class="sub" text-anchor="start">K·L은 JSON 파일 작업이다. 이미지 촬영·출력 기능을 의미하지 않는다.</text>
  <text x="32" y="741" class="sub" text-anchor="start">메뉴의 딤·바깥 클릭 닫기 등 세부 표현은 제안이며, 확정 동작과 구분한다.</text>
