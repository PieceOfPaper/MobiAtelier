<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="772" viewBox="0 0 1280 772" role="img" aria-labelledby="title desc">
  <title id="title">시스템 메뉴와 경로 옵션 화면의 배치</title>
  <desc id="desc">시스템 메뉴에 내보내기 가져오기 초기화 옵션 종료를 둔다. 별도 옵션 화면에는 게임 경로와 폴더 선택, 적용 후 다시 시작, 돌아가기를 둔다.</desc>
  <style>
text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#203849;font-size:18px} .title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#536c7b}.small{font-size:15px}.white{fill:#fff}.strong{font-weight:700}.muted{fill:#617c8a}.num{font-size:14px;font-weight:700;fill:white}
</style>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#d3ebe5" />
      <stop offset="1" stop-color="#f2e7cc" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="772" rx="0" fill="#f7f9fb" stroke="none" />
  <text x="32" y="43" class="title" text-anchor="start">시스템 메뉴 · 옵션의 하위 화면</text>
  <text x="32" y="74" class="sub" text-anchor="start">두 그림은 서로 다른 상태다. 옵션을 열면 경로 설정 화면으로 전환한다.</text>
